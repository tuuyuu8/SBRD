
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBRD Update Manager</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 16px;
  background: #101522;
  color: #edf2ff;
  font-family: system-ui, sans-serif;
}
main { max-width: 720px; margin: auto; }
.card {
  background: #1b263b;
  border: 1px solid #34425c;
  border-radius: 16px;
  padding: 22px;
  margin-bottom: 18px;
}
h1 { font-size: 27px; }
p { color: #b5c1d8; line-height: 1.6; }
label {
  display: block;
  margin: 17px 0 7px;
  font-weight: bold;
}
input, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 9px;
  border: 1px solid #52617b;
  background: #101827;
  color: white;
  font: inherit;
}
textarea { min-height: 90px; resize: vertical; }
button {
  border: 0;
  border-radius: 9px;
  padding: 12px 16px;
  margin: 10px 6px 0 0;
  background: #7775ff;
  color: white;
  font-weight: bold;
  cursor: pointer;
}
.secondary { background: #35445f; }
.result {
  display: none;
  margin-top: 20px;
  padding: 16px;
  border-radius: 10px;
  background: #101827;
  overflow-wrap: anywhere;
}
.result.show { display: block; }
.small { font-size: 13px; }
a { color: #b6c3ff; }
</style>
</head>
<body>
<main>
  <section class="card">
    <h1>🚀 SBRD Update Manager</h1>
    <p>新しいバージョンの情報を作成します。</p>
    <p>GitHubリポジトリ：tuuyuu8/SBRD</p>

    <label for="version">新しいバージョン</label>


    <label for="url">ショートカットの配布URL</label>
    <input id="url" type="url"
           placeholder="https://www.icloud.com/shortcuts/...">

    <label for="notes">更新内容（任意）</label>
    <textarea id="notes"
              placeholder="修正した内容など"></textarea>

    <button id="create">公開用の内容を作成</button>

    <div id="result" class="result">
      <h2>公開内容</h2>

      <label>version.txt に入れる内容</label>
      <input id="versionOutput" readonly>
      <button id="copyVersion">バージョンをコピー</button>

      <label>new version url.txt に入れる内容</label>
      <input id="urlOutput" readonly>
      <button id="copyUrl">URLだけをコピー</button>

      <p id="summary"></p>

      <button id="openVersion" class="secondary">
        GitHubのversion.txtを編集
      </button>
      <button id="openUrlFile" class="secondary">
        GitHubのnew version url.txtを編集
      </button>

      <p class="small">
        GitHubの編集画面で内容を貼り付け、Commit changesを押して保存してください。
        このサイトからGitHubへの自動書き込みは行いません。
      </p>
    </div>
  </section>

  <section class="card">
    <h2>現在の更新ファイル</h2>
    <p>
      <a href="https://raw.githubusercontent.com/tuuyuu8/SBRD/main/version.txt"
         target="_blank" rel="noopener">version.txt（Raw）</a>
    </p>
    <p>
      <a href="https://raw.githubusercontent.com/tuuyuu8/SBRD/main/new%20version%20url.txt"
         target="_blank" rel="noopener">new version url.txt（Raw）</a>
    </p>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

$("create").addEventListener("click", () => {
  const version = $("version").value.trim();
  const url = $("url").value.trim();
  const notes = $("notes").value.trim();

  if (!/^\d+\.\d+\.\d+$/.test(version)) {
    alert("バージョンは 1.4.5 の形式で入力してください。");
    return;
  }

  try {
    if (new URL(url).protocol !== "https:") throw new Error();
  } catch {
    alert("有効なHTTPSの配布URLを入力してください。");
    return;
  }

  $("versionOutput").value = version;
  $("urlOutput").value = url;
  $("summary").textContent =
    "バージョン: " + version +
    (notes ? "\n更新内容: " + notes : "");

  $("result").classList.add("show");
});

async function copyText(value, fallbackInput) {
  try {
    await navigator.clipboard.writeText(value);
    alert("コピーしました！");
  } catch {
    fallbackInput.focus();
    fallbackInput.select();
    alert("選択された内容をコピーしてください。");
  }
}

$("copyVersion").addEventListener("click", () => {
  copyText($("versionOutput").value, $("versionOutput"));
});

$("copyUrl").addEventListener("click", () => {
  copyText($("urlOutput").value, $("urlOutput"));
});

$("openVersion").addEventListener("click", () => {
  window.open(
    "https://github.com/tuuyuu8/SBRD/edit/main/version.txt",
    "_blank",
    "noopener"
  );
});

$("openUrlFile").addEventListener("click", () => {
  window.open(
    "https://github.com/tuuyuu8/SBRD/edit/main/new%20version%20url.txt",
    "_blank",
    "noopener"
  );
});
</script>
</body>
</html>
