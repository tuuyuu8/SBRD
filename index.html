
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBRD Update Manager</title>
<style>
:root{font-family:system-ui,sans-serif;color:#eaf0ff;background:#101522}
*{box-sizing:border-box}
body{margin:0;padding:24px 14px}
main{max-width:760px;margin:auto}
header,.card{background:#192235;border:1px solid #303d57;border-radius:18px;padding:22px;margin-bottom:18px}
h1{margin:0 0 8px;font-size:27px}
h2{font-size:19px;margin-top:0}
p,.hint{color:#aab8d0;line-height:1.6}
label{display:block;margin:17px 0 7px;font-weight:700}
input,textarea{display:block;width:100%;padding:12px;border:1px solid #45536d;border-radius:9px;background:#0e1523;color:white;font:inherit}
textarea{min-height:85px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 17px;background:#7775ff;color:white;font-weight:800;font-size:15px;cursor:pointer;margin-top:18px}
button:disabled{opacity:.5;cursor:wait}
.hint{font-size:12px}
.status{white-space:pre-wrap;overflow-wrap:anywhere;padding:13px;border-radius:10px;background:#0e1523;margin-top:16px;display:none}
.status.show{display:block}
a{color:#a8b4ff}
code{overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<header>
  <h1>🚀 SBRD Update Manager</h1>
  <p>バージョンと配布URLを入力して、GitHubに更新情報を公開します。</p>
  <p>リポジトリ：<strong>tuuyuu8/SBRD</strong></p>
</header>

<section class="card">
<h2>① GitHubへの接続</h2>
<label for="token">GitHubアクセストークン</label>
<input id="token" type="password" autocomplete="off"
 placeholder="github_pat_..." required>
<p class="hint">
トークンはこのページに保存しません。GitHubにアップロードしたり、
URLに含めたりもしません。共有PCでは使用後にページを閉じてください。
</p>

<h2 style="margin-top:28px">② 新しいバージョン</h2>
<label for="version">バージョン番号</label>
<input id="version" value="1.4.0" pattern="[0-9]+\.[0-9]+\.[0-9]+" required>
<p class="hint">例：1.3.4、1.4.0、2.0.0</p>

<label for="url">ショートカットの配布URL</label>
<input id="url" type="url"
 placeholder="https://www.icloud.com/shortcuts/..." required>

<label for="notes">更新内容</label>
<textarea id="notes" placeholder="例：ボス戦の不具合を修正"></textarea>

<button id="publish" type="button">GitHubに公開</button>
<div id="status" class="status" role="status"></div>
</section>

<section class="card">
<h2>③ Raw URL</h2>
<p>公開後、ここから最新バージョンを確認できます。</p>
<p><a href="https://raw.githubusercontent.com/tuuyuu8/SBRD/main/version.txt" target="_blank" rel="noopener">version.txtを開く</a></p>
<p><a href="https://raw.githubusercontent.com/tuuyuu8/SBRD/main/release.json" target="_blank" rel="noopener">release.jsonを開く</a></p>
</section>
</main>

<script>
const $ = id => document.getElementById(id);
const owner = "tuuyuu8";
const repo = "SBRD";
const branch = "main";

function message(text) {
  const el = $("status");
  el.textContent = text;
  el.classList.add("show");
}

async function githubRequest(path, token, options = {}) {
  const response = await fetch("https://api.github.com/repos/" +
    owner + "/" + repo + "/contents/" + path, {
      ...options,
      headers: {
        "Accept": "application/vnd.github+json",
        "Authorization": "Bearer " + token,
        "X-GitHub-Api-Version": "2022-11-28",
        ...(options.headers || {})
      }
    });

  if (!response.ok) {
    const detail = await response.text();
    throw new Error(path + "：HTTP " + response.status + "\n" + detail);
  }
  return response.json();
}

async function saveFile(path, content, token, description) {
  let sha;
  try {
    const existing = await githubRequest(
      path + "?ref=" + encodeURIComponent(branch), token
    );
    sha = existing.sha;
  } catch (error) {
    if (!String(error.message).includes("HTTP 404")) throw error;
  }

  const encoded = btoa(unescape(encodeURIComponent(content)));
  const body = {
    message: description,
    content: encoded,
    branch
  };
  if (sha) body.sha = sha;

  return githubRequest(path, token, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body)
  });
}

$("publish").addEventListener("click", async () => {
  const token = $("token").value.trim();
  const version = $("version").value.trim();
  const url = $("url").value.trim();
  const notes = $("notes").value.trim();
  const button = $("publish");

  if (!token) {
    message("GitHubアクセストークンを入力してください。");
    return;
  }
  if (!/^\d+\.\d+\.\d+$/.test(version)) {
    message("バージョンは 1.4.0 のように入力してください。");
    return;
  }
  try {
    const parsed = new URL(url);
    if (parsed.protocol !== "https:") throw new Error();
  } catch {
    message("有効な https:// の配布URLを入力してください。");
    return;
  }

  if (!confirm("SBRDのGitHubリポジトリに v" + version +
      " を公開しますか？")) return;

  button.disabled = true;
  message("GitHubに接続しています…");

  try {
    const release = {
      version,
      download_url: url,
      notes,
      published_at: new Date().toISOString()
    };

    await saveFile(
      "version.txt",
      version + "\n",
      token,
      "Release SBRD v" + version + " - update version.txt"
    );

    try {
      await saveFile(
        "release.json",
        JSON.stringify(release, null, 2) + "\n",
        token,
        "Release SBRD v" + version + " - update release metadata"
      );
    } catch (error) {
      throw new Error(
        "version.txt は更新されましたが、release.json の更新に失敗しました。\n" +
        error.message
      );
    }

    message(
      "公開に成功しました！\n\n" +
      "バージョン：v" + version + "\n" +
      "version.txt と release.json をGitHubに保存しました。\n\n" +
      "Raw URL：\n" +
      "https://raw.githubusercontent.com/tuuyuu8/SBRD/main/version.txt\n\n" +
      "配布URL：\n" + url +
      "\n\n※Rawへの反映には少し時間がかかる場合があります。"
    );
  } catch (error) {
    message("公開に失敗しました。\n" + error.message +
      "\n\nトークンの権限、リポジトリ名、ネット接続を確認してください。");
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
